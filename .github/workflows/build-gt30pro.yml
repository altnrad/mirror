name: Build Eden GT30Pro (Mali-only, arm64-v8a)

# Cloud build — no local setup needed (~40-90 min).
# Full guide: gt30pro-opt/build/CLOUD_BUILD_GUIDE_AR.md (in your package folder)
# Required files in THIS repo (your fork):
#   gt30pro-opt/patches/01-dynarmic-mt8350.patch
#   gt30pro-opt/patches/02-vulkan-mali-tbr.patch
#   gt30pro-opt/patches/03-shader-async-cache.patch
#   gt30pro-opt/patches/04-gt30pro-mali-strip.patch   (LSFG kept ON)
# This file must be at: .github/workflows/build-gt30pro.yml on branch master.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Checks out YOUR FORK (default). Do NOT point this at upstream:
      # the patch files live in your fork, and upstream does not have them.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "ndk;28.2.13676358"

      - name: Apply GT30Pro patches
        run: |
          git apply gt30pro-opt/patches/01-dynarmic-mt8350.patch || echo "01 skipped (context drift)"
          git apply gt30pro-opt/patches/02-vulkan-mali-tbr.patch || echo "02 skipped (context drift)"
          git apply gt30pro-opt/patches/03-shader-async-cache.patch || echo "03 skipped (context drift)"
          git apply gt30pro-opt/patches/04-gt30pro-mali-strip.patch

      - name: Build mainlineRelease
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358
          cd src/android
          ./gradlew :app:assembleMainlineRelease :app:copyMainlineReleaseOutputs --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Eden-GT30Pro-Mali-arm64
          path: |
            src/android/app/build/outputs/apk/mainline/release/*.apk
            artifacts/*.apk
            src/android/artifacts/*.apk
