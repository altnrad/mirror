name: Build Eden GT30Pro (Mali-only, arm64-v8a)

# Cloud build — no local setup needed (~40-90 min).
# v3 (2026-09-17): + host tools (glslang-tools/nasm/pkg-config, run #3 log proof),
# + official Eden CI command verbatim (copyMainlineReleaseOutputs only).
# Full guide: gt30pro-opt/build/CLOUD_BUILD_GUIDE_AR.md (in your package folder)
# Required files in THIS repo (your fork):
#   gt30pro-opt/patches/01-dynarmic-mt8350.patch
#   gt30pro-opt/patches/02-vulkan-mali-tbr.patch
#   gt30pro-opt/patches/03-shader-async-cache.patch
#   gt30pro-opt/patches/04-gt30pro-mali-strip.patch   (LSFG kept ON)
# This file must be at: .github/workflows/build-gt30pro.yml on branch master.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Checks out YOUR FORK (default). Do NOT point this at upstream:
      # the patch files live in your fork, and upstream does not have them.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships Android cmdline-tools preinstalled.
      # (android-actions/setup-android@v3 is broken: it tries to install the
      # long-removed 'tools' package -> "Failed to find package 'tools'",
      # exit code 1. That is exactly what killed run #1 after 29s.)
      - name: Setup Android SDK/NDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "ndk;28.2.13676358"

      # Host C++ tools required by Eden's own CMake (verified in source):
      # src/video_core/host_shaders/CMakeLists.txt runs
      # find_program(glslangValidator) + FATAL_ERROR if missing.
      # The stock runner image does not ship it -> install from Ubuntu repo.
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools nasm pkg-config

      - name: Apply GT30Pro patches
        run: |
          git apply gt30pro-opt/patches/01-dynarmic-mt8350.patch || echo "01 skipped (context drift)"
          git apply gt30pro-opt/patches/02-vulkan-mali-tbr.patch || echo "02 skipped (context drift)"
          git apply gt30pro-opt/patches/03-shader-async-cache.patch || echo "03 skipped (context drift)"
          git apply gt30pro-opt/patches/04-gt30pro-mali-strip.patch

      # Official Eden CI builds the phone APK with the copy task only
      # (.ci/build/android.sh: ./gradlew "copy${APK_FLAVOR}${TYPE}Outputs",
      # defaults Mainline + Release). Mirrored verbatim: single selector.
      - name: Build mainlineRelease
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358
          cd src/android
          ./gradlew "copyMainlineReleaseOutputs" --no-daemon

      - name: Locate built APKs
        run: find src/android/app/build/outputs -name "*.apk" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: Eden-GT30Pro-Mali-arm64
          path: |
            src/android/app/build/outputs/apk/**/*.apk
            artifacts/*.apk
            src/android/artifacts/*.apk
